# TODO: This config should be template that is configurable, i.e. user name,
#       UID/GID, etc.
image:
  distribution: "debian"
  release: "trixie"

source:
  downloader: debootstrap
  same_as: sid
  url: https://deb.debian.org/debian/

targets:
  lxc:
    create_message: |-
      You just created a {{ image.description }} container.

      To enable SSH, run: apt install openssh-server
      No default root or user password are set by LXC.

    config:
    - type: all
      before: 5
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/debian.common.conf

    - type: user
      before: 5
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/debian.userns.conf

    - type: all
      after: 4
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/common.conf

    - type: user
      after: 4
      content: |-
        lxc.include = LXC_TEMPLATE_CONFIG/userns.conf
    - type: all
      content: |-
        lxc.arch = {{ image.architecture_personality }}

files:
- path: /etc/hostname
  generator: hostname

- path: /etc/hosts
  generator: hosts

- path: /etc/resolvconf/resolv.conf.d/original
  generator: remove

- path: /etc/resolvconf/resolv.conf.d/tail
  generator: remove

- path: /etc/machine-id
  generator: dump
  content: uninitialized

- path: /var/lib/dbus/machine-id
  generator: remove

- path: /etc/systemd/network/eth0.network
  generator: dump
  content: |-
    [Match]
    Name=eth0

    [Network]
    DHCP=true

    [DHCPv4]
    UseDomains=true
    UseMTU=true

    [DHCP]
    ClientIdentifier=mac
  types:
  - container
  variants:
  - default

- path: /usr/local/bin/setup-user.sh
  generator: dump
  content: |
    #!/bin/bash

    # Check if script is run as root
    if [[ $EUID -ne 0 ]]; then
       echo "Run with root privileges" 
       exit 1
    fi

    # --- INPUTS ---
    OLD_USER="dev"
    NEW_USER=$1
    NEW_UID=$2
    NEW_GID=$3

    # Exit if any of params is empty
    if [[ -z "$OLD_USER" || -z "$NEW_USER" || -z "$NEW_UID" || -z "$NEW_GID" ]]; then
        exit 1
    fi

    # Get current values
    CURR_UID=$(id -u "$OLD_USER" 2>/dev/null)
    CURR_GID=$(id -g "$OLD_USER" 2>/dev/null)
    CURR_NAME=$(whoami) # Just a safety check

    if [[ -z "$CURR_UID" ]]; then
        echo "Error: User $OLD_USER does not exist."
        exit 1
    fi

    # 1. Change Group ID
    if [ "$CURR_GID" != "$NEW_GID" ]; then
        groupmod -g "$NEW_GID" "$(id -gn "$OLD_USER")"
    else
        echo "GID is already $NEW_GID, skipping."
    fi

    # 2. Change Username and UID
    if [ "$OLD_USER" != "$NEW_USER" ] || [ "$CURR_UID" != "$NEW_UID" ]; then
        usermod -l "$NEW_USER" -u "$NEW_UID" "$OLD_USER"
    else
        echo "Username and UID are already correct, skipping."
    fi

    # Update reference for the next steps since the user name has changed
    TARGET_USER=$NEW_USER
    if [ "$OLD_USER" == "$NEW_USER" ]; then TARGET_USER=$OLD_USER; fi

    # 3. Change Home Directory Path and Move Files
    # We check if the home directory actually needs renaming
    CURRENT_HOME=$(eval echo ~$TARGET_USER)
    NEW_HOME="/home/$TARGET_USER"

    if [ "$CURRENT_HOME" != "$NEW_HOME" ]; then
        usermod -d "$NEW_HOME" -m "$TARGET_USER"
    else
        echo "Home directory path is already correct, skipping."
    fi

    # 4. Change Group Name to match new username
    # Most Linux systems create a group named after the user
    GROUP_NAME=$(id -gn "$TARGET_USER")
    if [ "$GROUP_NAME" != "$TARGET_USER" ]; then
        groupmod -n "$TARGET_USER" "$GROUP_NAME"
    else
        echo "Group name already matches username, skipping."
    fi

    # 5. Fix Global File Permissions
    # Only run if UID or GID actually changed
    chown -R "$TARGET_USER:$TARGET_USER" "$NEW_HOME"

    # 6. Create new sudo rule for the new username
    echo "$TARGET_USER ALL=(ALL:ALL) NOPASSWD: ALL" > "/etc/sudoers.d/$TARGET_USER"
    chmod 0440 "/etc/sudoers.d/$TARGET_USER"

    echo "User setup completed"
  mode: "755"
  types:
  - container

- path: /usr/local/bin/configure-opensnitch.sh
  generator: dump
  content: |
    #!/bin/bash

    # 1. Get the default gateway IP address
    # This looks for the default route and extracts the IP
    GATEWAY_IP=$(ip route show default | awk '/default/ {print $3}')

    if [ -z "$GATEWAY_IP" ]; then
        echo "Error: Could not determine gateway IP address."
        exit 1
    fi

    # 2. Define the config file path
    CONFIG_FILE="/etc/opensnitchd/default-config.json"

    # 3. Create the JSON content
    # We use a heredoc to ensure the formatting is exact.
    cat <<EOF > "$CONFIG_FILE"
    {
      "DefaultAction": "deny",
      "Server": {
        "Address": "${GATEWAY_IP}:50051",
        "Enabled": true
      }
    }
    EOF

    # 4. Restart opensnitchd to apply changes (assuming systemd)
    if systemctl is-active --quiet opensnitchd; then
        systemctl restart opensnitchd
        echo "opensnitchd restarted."
    fi
  mode: "755"

# - path: /etc/sysctl.d/70-disable-ipv6.conf
#   generator: dump
#   content: |-
#     net.ipv6.conf.all.disable_ipv6 = 1
#     net.ipv6.conf.default.disable_ipv6 = 1
#     net.ipv6.conf.lo.disable_ipv6 = 1

packages:
  manager: apt
  update: true
  cleanup: true
  sets:
  - packages:
    - apt-utils
    - bash
    - bash-completion
    - bc
    - bzip2
    - ca-certificates
    - curl
    - dialog
    - diffutils
    - fd-find
    - findutils
    - fzf
    - git
    - gnupg
    - gpgsm
    - hostname
    - init
    - iproute2
    - iputils-ping
    - jq
    - keyutils
    - less
    - libcap2-bin
    - libkrb5-3
    - locales
    - lsof
    - man-db
    - manpages
    - ncurses-base
    - ncurses-term
    - net-tools
    - netbase
    - opensnitch
    - openssh-client
    - p11-kit-modules
    - passwd
    - pigz
    - pinentry-curses
    - procps
    - ripgrep
    - rsync
    - sudo
    - tcpdump
    - time
    - tmux
    - traceroute
    - tree
    - tzdata
    - udev
    - unzip
    - util-linux
    - vim
    - wget
    - xz-utils
    - yq
    - zip
    action: install
    flags:
    - "--no-install-recommends"

  - packages:
    - isc-dhcp-client
    releases:
    - bookworm
    - trixie
    action: install

  - packages:
    - debian-loong64-non-official-archive-keyring
    action: install
    early: true
    architectures:
    - loong64
    releases:
    - trixie

  - packages:
    - dbus
    - systemd-resolved
    action: install
    early: true
    releases:
    - bookworm
    - trixie
    - forky

  - packages:
    - polkitd
    action: install
    architectures:
    - amd64
    - arm64
    releases:
    - trixie
    - forky

  - packages:
    - pkexec
    action: install
    architectures:
    - amd64
    - arm64
    releases:
    - bookworm
    - trixie
    - forky

  - packages:
    - netplan.io
    action: install
    variants:
    - cloud
    releases:
    - forky

  repositories:
  - name: sources.list
    url: |-
      deb http://deb.debian.org/debian {{ image.release }} main contrib
      deb http://deb.debian.org/debian {{ image.release }}-updates main contrib
      deb http://deb.debian.org/debian-security/ {{ image.release }}-security main contrib
    architectures:
    - amd64
    - arm64
    - armhf
    - riscv64

  - name: sources.list
    url: |-
      deb https://loong13.debian.net/debian-loong64/ {{ image.release }} main contrib
      deb https://loong13.debian.net/debian-loong64/ {{ image.release }}-updates main contrib
      deb https://loong13.debian.net/debian-loong64-security/ {{ image.release }}-security main contrib
    architectures:
    - loong64
    releases:
    - trixie

  - name: sources.list
    url: |-
      deb http://deb.debian.org/debian {{ image.release }} main contrib
      deb http://deb.debian.org/debian {{ image.release }}-updates main contrib
      deb http://deb.debian.org/debian-security/ {{ image.release }}-security main contrib
    architectures:
    - loong64
    releases:
    - forky

actions:

# Set up non-root (dev) user
# Use expected UID/GID as initial values
- trigger: post-packages
  action: |-
    #!/bin/sh
    groupadd -g 1000 dev || groupadd dev
    useradd -u 1000 -g 1000 -m -s /bin/bash dev || useradd -g dev -m -s /bin/bash dev

# Install mise https://mise.jdx.dev/installing-mise.html
- trigger: post-packages
  action: |-
    #!/bin/sh
    curl -fsSL https://mise.run | MISE_INSTALL_PATH=/usr/local/bin/mise MISE_INSTALL_FROM_GITHUB=1 sh
    activation='eval "$(mise activate bash)"'
    grep -qxF "$activation" /etc/bash.bashrc 2>/dev/null || printf '%s\n' "$activation" >> /etc/bash.bashrc

    su dev <<'EOF'
      mise completion bash --install
      mise use -g opencode neovim
    EOF

- trigger: post-packages
  action: |-
    #!/bin/sh
    set -eux

    # Enable networkd
    systemctl enable systemd-networkd.service
    systemctl enable systemd-networkd.socket

- trigger: post-packages
  action: |-
    #!/bin/sh
    set -eux

    # Enable systemd-resolved
    systemctl enable systemd-resolved.service
  releases:
  - bookworm
  - trixie
  - forky

- trigger: post-packages
  action: |-
    #!/bin/sh
    set -eux

    # Make sure the locale is built and functional
    echo en_US.UTF-8 UTF-8 >> /etc/locale.gen
    locale-gen en_US.UTF-8 UTF-8
    update-locale LANG=en_US.UTF-8

    # Cleanup underlying /run
    mount -o bind / /mnt
    rm -rf /mnt/run/*
    umount /mnt

    # Cleanup temporary shadow paths
    rm /etc/*-

- trigger: post-packages
  action: |-
    #!/bin/sh
    mkdir -p /etc/apparmor.d/local
    touch /etc/apparmor.d/local/sbin.dhclient
  releases:
  - trixie
  - forky

- trigger: post-files
  action: |-
    #!/bin/sh
    set -eux

    umount -l /etc/resolv.conf || true
    ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
  releases:
  - bookworm
  - trixie
  - forky

# Enable OpenSnitch (firewall)
- trigger: post-files
  action: |-
   #!/bin/sh
   systemctl enable opensnitch

mappings:
  architecture_map: debian
